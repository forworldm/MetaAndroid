name: Building APK

on:
  push:
    branches:
      - dev-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JAVA
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout submodules
        run: git clone --single-branch --branch Alpha --depth 1 https://github.com/MetaCubeX/mihomo.git core/src/foss/golang/clash

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Update Go packages
        run: cd core/src/foss/golang && go mod tidy

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Build APK
        run: ${{ github.workspace }}/gradlew clean app:assembleMetaRelease

      - name: Upload APK arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a
          path: ${{ github.workspace }}/app/build/outputs/apk/meta/release/*-arm64-v8a-*

      - name: Upload APK x86_64
        uses: actions/upload-artifact@v4
        with:
          name: x86_64
          path: ${{ github.workspace }}/app/build/outputs/apk/meta/release/*-x86_64-*
